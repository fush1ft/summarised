org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official

# KSP still registers its generated sources through the kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin rejects by default. This is AGP's own documented
# opt-out and can be dropped once KSP registers sources via android.sourceSets.
android.disallowKotlinSourceSets=false
