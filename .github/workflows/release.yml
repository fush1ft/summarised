name: Release

# Release artifacts are built here rather than uploaded from a developer's
# machine, so what users install always corresponds to a specific commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0-alpha02)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checks
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      # There is no signing key yet, so this publishes the debug variant. Once a
      # keystore exists it should be added as repository secrets and this step
      # replaced with assembleRelease plus a signing config.
      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace \
            -Psummarised.versionName="${{ steps.version.outputs.value }}" \
            -Psummarised.versionCode="${{ github.run_number }}"

      - name: Name the artifact
        id: artifact
        run: |
          NAME="summarised-${{ steps.version.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" | tee "$NAME.sha256"

      # Notes come from the changelog so they describe what actually shipped.
      # They were hardcoded once and immediately went stale, claiming nothing
      # worked in a release where recording did.
      - name: Compose release notes
        run: |
          {
            echo "Early alpha, built by CI from commit ${GITHUB_SHA:0:7}."
            echo
            awk '/^## \[Unreleased\]/{flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md \
              | sed '/^$/{ x; /./d; x; h; }'
            echo
            echo "### Before you install"
            echo
            echo "This is a **debug build signed with the standard Android debug key**,"
            echo "because the project has no release keystore yet. The signature proves"
            echo "nothing about who built it, and the app is debuggable. Fine for trying"
            echo "out; not a secure release, and not an upgrade path for later signed"
            echo "builds - you will have to uninstall it first."
            echo
            echo "It installs alongside any future release build, since the debug"
            echo "variant uses the application ID suffix \`.debug\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Summarised ${{ steps.version.outputs.value }}" \
            --prerelease \
            --notes-file release-notes.md \
            "${{ steps.artifact.outputs.name }}" \
            "${{ steps.artifact.outputs.name }}.sha256"
