name: App preview APK

# Builds the app, runs its unit tests and lint, and publishes the debug APK as
# a rolling pre-release (tag app-preview) so it can be installed on a phone.
on:
  push:
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/app-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build, test, lint and publish app APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :core:database:testDebugUnitTest :core:designsystem:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Name the artifact
        id: artifact
        run: |
          NAME="summarised-preview-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app-preview --cleanup-tag --yes || true
          gh release create app-preview \
            --target "${{ github.sha }}" \
            --title "Summarised preview (${GITHUB_SHA::7})" \
            --prerelease \
            --notes "$(cat <<'NOTES'
          Průběžná testovací verze aplikace Summarised, sestavená z posledního commitu.

          **Instalace:** stáhni APK níže a otevři ho. Je podepsaný veřejným
          testovacím klíčem, takže se každá další verze nainstaluje přes předchozí.
          Aplikace se jmenuje **Summarised** a nainstaluje se vedle Summarised Lab.

          Aby fungovalo podržení vypínače, vyber v nastavení jako digitálního
          asistenta **Summarised** místo Labu.
          NOTES
          )" \
            "${{ steps.artifact.outputs.name }}"
