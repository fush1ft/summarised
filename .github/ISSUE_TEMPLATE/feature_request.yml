name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: >
        Summarised runs entirely on-device and ships as free software. Features
        that need a server, a proprietary SDK, or an account are out of scope.
      options:
        - label: This can work offline, on the device
        - label: This needs no proprietary dependency or account
